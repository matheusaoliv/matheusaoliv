name: Atualiza arte do perfil

on:
  schedule:
    - cron: "17 6 * * *" # ~03:17 em Brasília, todo dia
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Baixa contribuições e contagem de repositórios
        run: |
          python scripts/fetch_contributions.py
          python scripts/fetch_profile_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token fine-grained só leitura do dono do perfil (opcional): inclui privados.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Renderiza SVGs
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
          python scripts/make_info_card.py
          python scripts/make_hero_svg.py
          python scripts/make_projects_svg.py
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data contrib-heatmap.svg stats.svg info-card.svg hero.svg projects
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualiza gráfico de contribuições [skip ci]"
            git push
          fi
