<svg xmlns="http://www.w3.org/2000/svg" width="430" height="256" viewBox="0 0 430 256" role="img" aria-labelledby="t">
<title id="t">Portal Japeri (govtech · unofficial demo): Japeri's city services in one place: plain-language search, 4-step online requests and protocol tracking. Stack: JavaScript, PWA, Capacitor. Live at portal-japeri.vercel.app.</title>
<style>
svg { font-family: 'SFMono-Regular', ui-monospace, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }

.orb-a { animation: float-a 9s ease-in-out infinite; }
.orb-b { animation: float-b 11s ease-in-out infinite 1.1s; }
.orb-c { animation: float-c 13s ease-in-out infinite .6s; }
@keyframes float-a { 50% { transform: translate(26px, -16px); opacity: .85; } }
@keyframes float-b { 50% { transform: translate(-22px, 16px); opacity: .7; } }
@keyframes float-c { 50% { transform: translate(16px, -10px); opacity: .6; } }


.rise { animation: rise .6s cubic-bezier(.2,.75,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
