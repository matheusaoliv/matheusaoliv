</g>
<g class="rise" style="animation-delay:.25s"><text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Japeri's city services in one place: plain-language</text><text x="20" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">search, 4-step online requests and protocol tracking.</text></g>
