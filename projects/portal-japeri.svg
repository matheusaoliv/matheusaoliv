<stop offset="0" stop-color="#0d1117"/><stop offset=".54" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/>
</linearGradient>
<radialGradient id="orb0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.6"/>
<stop offset=".58" stop-color="#58a6ff" stop-opacity=".16"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="orb1"><stop offset="0" stop-color="#39d353" stop-opacity="0.42"/>
<stop offset=".58" stop-color="#39d353" stop-opacity=".16"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#a371f7" stop-opacity="0.6"/>
<stop offset=".58" stop-color="#a371f7" stop-opacity=".16"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>

<linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#e6edf3"/><stop offset="1" stop-color="#2ad5ef"/></linearGradient>
</defs>
<clipPath id="card"><rect width="430" height="256" rx="20"/></clipPath>
<g clip-path="url(#card)">
<rect width="430" height="256" rx="20" fill="url(#bg)"/>
