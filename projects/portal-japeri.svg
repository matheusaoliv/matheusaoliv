<ellipse class="orb-b" cx="344" cy="51" rx="129" ry="115" fill="url(#orb1)" opacity=".6"/>
<ellipse class="orb-c" cx="237" cy="246" rx="163" ry="92" fill="url(#orb2)" opacity=".5"/>
<rect x=".5" y=".5" width="429" height="255" rx="20" fill="none" stroke="#58a6ff" stroke-opacity=".28"/>

<g transform="translate(12 12)">
<rect width="406" height="232" rx="16" fill="#080a0e" fill-opacity=".6" stroke="#58a6ff" stroke-opacity=".48"/>
